<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פריז — הטיול שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#111;--ink2:#3a3a3a;--paper:#f7f3ea;--card:#fff;--line:#d9d2c0;--red:#d9382c;--gold:#e0a100;--blue:#1f6fd1;--green:#1f9d5a;--mut:#5a5a5a;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);background-image:radial-gradient(circle,#d9d2c0 1px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:84px}
h1,h2,h3{margin:0;font-family:'Heebo',sans-serif;font-weight:900;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:var(--blue)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.top{padding:44px 0 4px}
.top .wrap{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{font-size:46px;line-height:1}
.kick{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--mut)}
.sync{font-size:11px;color:var(--mut);margin-top:4px}
.cd{background:#111;color:#fff;border-radius:999px;padding:7px 16px;display:flex;align-items:baseline;gap:8px;white-space:nowrap;margin-top:4px}
.cd b{font-size:20px;font-weight:900}
.cd span{font-size:12px;font-weight:500}
nav{position:fixed;bottom:0;inset-inline:0;background:#111;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:880px;margin:0 auto;display:flex;justify-content:space-around;padding:10px 4px}
nav button{color:#e6e6e6;font-size:12px;font-weight:500;position:relative}
nav button span{display:block;padding:6px 8px;border-radius:999px;white-space:nowrap}
nav button.on span{background:#fff;color:#111;font-weight:900}
nav .badge{position:absolute;top:-7px;inset-inline-start:-3px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-weight:700}
main{padding-top:14px}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:24px}
.sec small{color:var(--mut)}
.card{background:var(--card);border:2px solid #111;border-radius:var(--r);padding:14px 16px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.btn{display:inline-flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;text-decoration:none}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:#fff;color:#111;border:2px solid #111}
.btn.sm{padding:6px 12px;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid #111;background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.chip.on{background:#111;color:#fff}
.lg{flex:none;display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;background:#fff;border:2px solid #111;border-radius:999px;padding:4px 12px}
.lg i{width:20px;height:8px;border-radius:4px;display:block}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.s-todo{background:#fde2df;color:#a8281e}.s-progress{background:#fbeec2;color:#7a5200}.s-done{background:#d6f0e1;color:#146c3f}.s-skip{background:#e8e8e8;color:#555}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.ico{width:38px;height:38px;border-radius:50%;background:var(--paper);border:2px solid #111;display:grid;place-items:center;font-size:19px;flex:none}
.x{color:var(--mut);font-size:18px;padding:4px 8px}
.ring{text-align:center;padding:12px 6px}
.ring svg{width:74px;height:74px}
.ring b{display:block;font-size:13px;margin-top:4px}
.ring span{font-size:12px;color:var(--mut)}
.stat{padding:10px 14px}
.stat b{display:block;font-size:28px;font-weight:900;line-height:1.1}
.stat span{font-size:13px;color:var(--mut);font-weight:500}
.net{padding:10px 6px 4px}
.net svg{display:block;width:100%;height:auto}
.stn{cursor:pointer}
.tl{position:relative;margin:10px 0 0;padding-inline-start:26px}
.tl:before{content:"";position:absolute;inset-inline-start:6px;top:8px;bottom:8px;width:10px;border-radius:5px;background:var(--dc,#111)}
.stop{position:relative;margin-bottom:10px}
.dot{position:absolute;inset-inline-start:-25px;top:13px;width:20px;height:20px;border-radius:50%;background:#fff;border:3.5px solid #111;cursor:pointer}
.stop.done .dot{background:#111}
.stop.done .nm{text-decoration:line-through;opacity:.55}
.stop .tm{font-weight:800;color:#111;font-size:14px;min-width:44px}
.stop .nm{font-weight:800;font-size:17px}
.leg{font-size:12.5px;color:var(--mut);margin:-2px 0 10px;display:flex;gap:10px;align-items:center}
.tip{font-size:13.5px;color:var(--ink2);margin-top:4px}
.mapbox{background:#efe9db;border:2px solid #111;border-radius:var(--r);overflow:hidden;position:relative;touch-action:none}
.mapbox svg{display:block;width:100%;height:auto;cursor:grab}
.zoom{position:absolute;top:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;background:#fff;border:2px solid #111;font-size:20px;font-weight:800}
.pin{cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;border:2px solid #111;padding:20px 20px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:24px}}
.sheet h3{font-size:24px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;color:var(--ink2)}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid #111;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pk{border:2px solid #111;background:#fff;border-radius:12px;padding:5px 10px;font-size:13.5px;font-weight:600}
.pk.on{background:#111;color:#fff}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:15.5px}
.msg.u{align-self:flex-start;background:#111;color:#fff;border-end-start-radius:6px}
.msg.a{align-self:flex-end;background:#fff;border:2px solid #111;border-end-end-radius:6px}
.act{display:inline-block;background:#d6f0e1;color:#146c3f;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;margin:0 0 6px 6px}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin:0 2px;animation:bl 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.2}40%{opacity:1}}
.ask{position:sticky;bottom:78px;background:var(--paper);padding:8px 0 4px;display:flex;gap:8px}
.ask input{flex:1}
@media(max-width:520px){.g3{gap:8px}.ring svg{width:62px;height:62px}}
</style>
</head>

function legStats(ids){let km=0;for(let i=1;i<ids.length;i++)km+=hav(P[ids[i-1]],P[ids[i]]);return{km,min:walkMin(km)}}
const fmtKm=k=>k<1?Math.round(k*1000)+' מ׳':k.toFixed(1)+' ק״מ';
const q=id=>encodeURIComponent(P[id].en+', Paris');
const gmPlace=id=>`https://www.google.com/maps/search/?api=1&query=${q(id)}`;
function gmDir(ids){ids=ids.filter(i=>P[i]);if(ids.length<2)return ids[0]?gmPlace(ids[0]):'https://www.google.com/maps';
 const mid=ids.slice(1,-1).slice(0,9).map(q).join('%7C');
 return `https://www.google.com/maps/dir/?api=1&origin=${q(ids[0])}&destination=${q(ids[ids.length-1])}${mid?'&waypoints='+mid:''}&travelmode=walking`}
function nearest(ids){if(ids.length<3)return ids.slice();const left=ids.slice(1),out=[ids[0]];while(left.length){const c=P[out[out.length-1]];let bi=0,bd=1e9;left.forEach((id,i)=>{const d=hav(c,P[id]);if(d<bd){bd=d;bi=i}});out.push(left.splice(bi,1)[0])}return out}

 <div class="mut" style="margin:8px 0">${r.ids.map(id=>P[id].e+' '+esc(P[id].n)).join(' ← ')}</div><div class="mut"><b>🚶 ${fmtKm(st.km)} · ~${st.min} דק׳</b></div>
 <div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm" data-a="routeMap" data-v="${i}">🗺️ במפה</button><a class="btn ghost sm" target="_blank" rel="noopener" href="${gmDir(r.ids)}">🧭 ניווט</a><button class="btn ghost sm" data-a="routeAdd" data-v="${i}">＋ ליום חדש</button></div></div>`}).join('')+`</div>`;
 h+=`<div class="sec"><h2>בנו מסלול משלכם</h2><small>בחרו מקומות</small></div><div class="card"><div class="pick">`+Object.keys(P).map(id=>`<button class="pk ${B.sel.includes(id)?'on':''}" data-a="bpick" data-v="${id}">${P[id].e} ${esc(P[id].n)}</button>`).join('')+`</div>
 <div class="row" style="margin-top:12px;flex-wrap:wrap"><label style="margin:0;display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="bauto" ${B.auto?'checked':''} style="width:auto"> סדר אוטומטי הקצר ביותר</label><span class="sp"></span><button class="btn red" data-a="bbuild">בנה מסלול ✨</button></div></div>`;
 if(B.res){const r=B.res,st=legStats(r);h+=`<div class="card" style="margin-top:12px"><b style="font-size:18px">המסלול שלכם</b><div class="mapbox" style="margin:10px 0">${mapSVG({routes:[{ids:r,c:'#b23a54',w:4}],pins:r,seq:r,labels:true,vb:fitVB(r)})}</div>
 <div class="mut">${r.map((id,i)=>(i+1)+'. '+esc(P[id].n)).join(' · ')}</div><div style="margin:8px 0"><b>🚶 ${fmtKm(st.km)} · ~${st.min} דק׳ הליכה (ללא ביקור)</b></div>
 <div class="row" style="flex-wrap:wrap"><a class="btn sm" target="_blank" rel="noopener" href="${gmDir(r)}">🧭 ניווט</a><button class="btn ghost sm" data-a="bAddDay">＋ שמרו כיום בלוז</button></div></div>`}
 return h}
function fitVB(ids){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ids.forEach(id=>{const[x,y]=px(P[id].lat,P[id].lon);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
 const pad=70;x0-=pad;x1+=pad;y0-=pad;y1+=pad;let w=x1-x0,h=y1-y0;const ar=W/H;if(w/h<ar){const nw=h*ar;x0-=(nw-w)/2;w=nw}else{const nh=w/ar;y0-=(nh-h)/2;h=nh}return[x0,y0,w,h].map(n=>+n.toFixed(1))}

 <div class="mut" style="margin-top:8px">הוא לא יכול להזמין או לשלם בשמכם. הוא מארגן, מנסח הודעות, ומסמן בדף מה סגרתם.</div></div>

function agentInstr(){
 const places=Object.keys(P).map(id=>id+'='+P[id].n).join(', ');
 return `אתם הסוכן האישי של זוג ישראלי שמתכנן טיול לפריז, ותפקידכם לעזור להם לסגור את כל מה שפתוח: טיסות, מלון, כרטיסים, משימות.
כללים: ענו בעברית, קצר וחם, בלי הקדמות. קודם קראו את מצב הטיול עם get_trip. כשהמשתמשים מספרים שסגרו או שינו משהו — עדכנו אותו בדף בעזרת הכלים (update_booking, add_task, complete_task, add_stop, add_booking, set_start_date) ואז אשרו במשפט אחד מה עודכן.
אתם לא יכולים להזמין, לשלם או לשלוח הודעות בשמם, ואל תטענו שעשיתם זאת. אפשר לנסח להם הודעות/מיילים (באנגלית או צרפתית אם צריך) להעתקה, לתעדף, ולבנות תוכנית פעולה עם סדר וזמנים.
אין לכם גישה לאינטרנט: אל תמציאו מחירים, שעות פתיחה, מספרי הזמנה או כללי כניסה — אמרו שצריך לוודא באתר הרשמי. אם חסר מידע (תאריכים, שם המלון), שאלו שאלה אחת קצרה.
מקומות זמינים להוספה ללוז (id=שם): ${places}.
תאריך היום: ${new Date().toISOString().slice(0,10)}.`}
function agentTools(cur){
 const act=t=>{cur.acts.push(t);save();softRender();updateChat()};
 const bk=id=>S.bookings.find(b=>b.id===id);
 return [
 {name:'get_trip',description:'מחזיר את מצב הטיול: תאריך יציאה, ימים ותחנות, הזמנות עם סטטוס, ומשימות.',inputSchema:{type:'object',properties:{}},
  execute:()=>({start:S.start||null,today:new Date().toISOString().slice(0,10),
   days:S.days.map((d,i)=>({day:i+1,title:d.title,stops:d.stops.map(s=>(s.t?s.t+' ':'')+(s.p&&P[s.p]?P[s.p].n:'')+(s.txt?' ('+s.txt+')':''))})),
   bookings:S.bookings.map(b=>({id:b.id,name:b.n,category:b.cat,status:b.status,urgent:!!b.urgent,when:b.when,code:b.code,price:b.price,note:b.note})),
   tasks:S.tasks.map(t=>({id:t.id,text:t.txt,urgent:t.urgent,done:t.done}))})},
 {name:'update_booking',description:'עדכון הזמנה קיימת לפי id. status אחד מ: todo, progress, done, skip.',inputSchema:{type:'object',properties:{id:{type:'string'},status:{type:'string',enum:ORDER},when:{type:'string'},code:{type:'string'},price:{type:'string'},note:{type:'string'}},required:['id']},
  execute:i=>{const b=bk(i.id);if(!b)throw new Error('לא נמצאה הזמנה '+i.id);['status','when','code','price','note'].forEach(k=>{if(i[k]!=null&&(k!=='status'||ORDER.includes(i[k])))b[k]=i[k]});act(b.n+' → '+STATUS[b.status]);return{ok:true}}},
 {name:'add_booking',description:'הוספת הזמנה חדשה למעקב.',inputSchema:{type:'object',properties:{name:{type:'string'},category:{type:'string'},urgent:{type:'boolean'}},required:['name']},
  execute:i=>{const b={id:uid(),cat:i.category||'כללי',e:'🎫',n:i.name,urgent:i.urgent?1:0,status:'todo',when:'',code:'',price:'',note:''};S.bookings.push(b);act('נוספה הזמנה: '+i.name);return{ok:true,id:b.id}}},
 {name:'add_task',description:'הוספת משימה לרשימת "לסגור".',inputSchema:{type:'object',properties:{text:{type:'string'},urgent:{type:'boolean'}},required:['text']},
  execute:i=>{S.tasks.push({id:uid(),txt:i.text,urgent:!!i.urgent,done:false});act('נוספה משימה: '+i.text);return{ok:true}}},
 {name:'complete_task',description:'סימון משימה כבוצעה (או לא) לפי id.',inputSchema:{type:'object',properties:{id:{type:'string'},done:{type:'boolean'}},required:['id']},
  execute:i=>{const t=S.tasks.find(x=>x.id===i.id);if(!t)throw new Error('לא נמצאה משימה');t.done=i.done!==false;act((t.done?'בוצע: ':'נפתח מחדש: ')+t.txt);return{ok:true}}},
 {name:'add_stop',description:'הוספת תחנה ללוז. day מתחיל ב-1. place הוא id ממקומות הידועים (אופציונלי), txt טקסט חופשי, time בפורמט HH:MM.',inputSchema:{type:'object',properties:{day:{type:'integer'},place:{type:'string'},txt:{type:'string'},time:{type:'string'}},required:['day']},
  execute:i=>{const d=S.days[(i.day|0)-1];if(!d)throw new Error('יום לא קיים');const p=i.place&&P[i.place]?i.place:'';if(!p&&!i.txt)throw new Error('צריך place או txt');d.stops.push({id:uid(),t:i.time||'',p,txt:i.txt||'',done:false});d.stops.sort((a,b)=>(a.t||'99').localeCompare(b.t||'99'));act('נוספה תחנה ליום '+i.day);return{ok:true}}},
 {name:'set_start_date',description:'קביעת תאריך היציאה, בפורמט YYYY-MM-DD.',inputSchema:{type:'object',properties:{date:{type:'string'}},required:['date']},
  execute:i=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(i.date))throw new Error('פורמט תאריך שגוי');S.start=i.date;act('תאריך יציאה: '+i.date);return{ok:true}}}
 ]}
async function agentSend(text){
 text=(text||'').trim();if(!text||AG.busy||!AG.sample)return;
 AG.msgs.push({role:'user',text});const cur={role:'assistant',text:'',acts:[]};AG.msgs.push(cur);AG.busy=true;updateChat();
 const input=AG.msgs.slice(0,-1).map((m,i)=>({role:m.role,content:i===0?agentInstr()+'\n\n---\n'+m.text:m.text}));
 try{
  const r=await AG.sample(input,{tools:agentTools(cur),cache:false,onText:({text})=>{cur.text=text;updateChat()}});
  cur.text=(r&&r.text)||cur.text||'בוצע.';
 }catch(e){
  cur.text=e&&e.code==='not_granted'?'צריך לאשר לסוכן הרשאה כדי לעבוד.':e&&e.code==='rate_limited'?'הרבה בקשות בבת אחת. נסו שוב בעוד רגע.':(e&&e.text)||'משהו השתבש. נסו שוב.';
 }
 AG.busy=false;updateChat();
}

 try{AG.sample=(window.claude&&claude.use)?await claude.use('sample'):null}catch(e){AG.sample=null}
 AG.checked=true;if(tab==='agent'&&!AG.busy)render();
}

 tab:v=>{tab=v;render();scrollTo(0,0)},

 addStop:v=>stopModal(+v),
 editStop:(v,el)=>stopModal(+el.dataset.d,findStop(+el.dataset.d,v)),

 zin:()=>{M.z=Math.min(5,M.z*1.5);render()},
 zout:()=>{M.z=Math.max(1,M.z/1.5);render()},
 pinToDay:v=>{modal('להוסיף ליום',`<label>יום</label><select name="d">${S.days.map((d,i)=>`<option value="${i}">יום ${i+1} · ${esc(d.title)}</option>`).join('')}</select><label>שעה (אופציונלי)</label><input type="time" name="t">`,fd=>{const d=S.days[+fd.get('d')];d.stops.push({id:uid(),t:fd.get('t')||'',p:v,txt:'',done:false});d.stops.sort((a,b)=>(a.t||'99').localeCompare(b.t||'99'))})},
 routeMap:v=>{M.extra=ROUTES[+v].ids;M.sel=null;M.z=1;M.cx=W/2;M.cy=H/2;tab='map';render();scrollTo(0,0)},
 routeAdd:v=>{const r=ROUTES[+v];addDayFrom(r.n,r.e,r.ids)},
 bpick:v=>{const i=B.sel.indexOf(v);i>=0?B.sel.splice(i,1):B.sel.push(v);B.res=null;render()},
 bbuild:()=>{const a=$('#bauto');B.auto=a?a.checked:B.auto;if(B.sel.length<2){B.res=null;modal('מעט מדי',`<p>בחרו לפחות שני מקומות כדי לבנות מסלול.</p>`,()=>{});return}B.res=B.auto?nearest(B.sel):B.sel.slice();render()},
 bAddDay:()=>{if(B.res)addDayFrom('מסלול משלנו','✨',B.res)},
 bf:v=>{bFilter=v;render()},
 bCycle:v=>{const b=S.bookings.find(x=>x.id===v);b.status=ORDER[(ORDER.indexOf(b.status)+1)%ORDER.length];save();render()},
 editBook:v=>bookModal(S.bookings.find(x=>x.id===v)),
 addBook:()=>bookModal(null),
 tTog:v=>{const t=S.tasks.find(x=>x.id===v);t.done=!t.done;save();render()},
 tDel:v=>{S.tasks=S.tasks.filter(x=>x.id!==v);save();render()},
 addTask:()=>modal('משימה חדשה',`<label>מה צריך לעשות?</label><input name="txt" required><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="u" style="width:auto"> דחוף</label>`,fd=>S.tasks.push({id:uid(),txt:fd.get('txt'),urgent:!!fd.get('u'),done:false})),
 share:()=>{let t='🗼 הטיול שלנו לפריז\n';S.days.forEach((d,i)=>{t+=`\n*יום ${i+1}${dayDate(i)?' · '+dayDate(i):''} — ${d.title}*\n`;d.stops.forEach(s=>{t+=`${s.t?s.t+' ':''}${s.p&&P[s.p]?P[s.p].n:''}${s.txt?(s.p?' ('+s.txt+')':s.txt):''}\n`})});
  modal('הלוז להעתקה',`<textarea id="sh" readonly style="min-height:260px">${esc(t)}</textarea>`,()=>{});setTimeout(()=>{const e=$('#sh');if(e){e.select();try{navigator.clipboard.writeText(t)}catch(x){}}},50)},
 mclose:(v,el,e)=>{if(e.target===el)closeModal()},
 mclose2:()=>closeModal(),
 pin:(v)=>{M.sel=v;render()},
 quick:v=>agentSend(QUICK[+v]),
 netStop:(v,el)=>{const s=findStop(+el.dataset.d,v);if(s){s.done=!s.done;save();render()}},
 netHub:()=>{const b=S.bookings.find(x=>x.id==='b_h');if(b)bookModal(b);else{tab='book';render()}},
 bDone:v=>{const b=S.bookings.find(x=>x.id===v);if(b){b.status='done';save();render()}}
};
let dragMoved=false;
document.addEventListener('click',e=>{
 const pin=e.target.closest('[data-pin]');
 if(pin){if(!dragMoved){M.sel=pin.dataset.pin;render()}return}
 const el=e.target.closest('[data-a]');if(!el)return;
 const f=A[el.dataset.a];if(f){e.stopPropagation();f(el.dataset.v,el,e)}});
document.addEventListener('submit',e=>{if(e.target.id==='askform'){e.preventDefault();const i=document.getElementById('askin'),t=i.value;i.value='';agentSend(t)}});
document.addEventListener('change',e=>{if(e.target.id==='start'){S.start=e.target.value;save();render()}});
/* map drag */
let drag=null;
document.addEventListener('pointerdown',e=>{const s=e.target.closest('#mapsvg');if(!s)return;drag={x:e.clientX,y:e.clientY,cx:M.cx,cy:M.cy,s,moved:false};dragMoved=false});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6){drag.moved=true;dragMoved=true}
 if(!drag.moved)return;const r=drag.s.getBoundingClientRect(),k=(W/M.z)/r.width;M.cx=drag.cx-dx*k;M.cy=drag.cy-dy*k;drag.s.setAttribute('viewBox',mapVB().join(' '))});
document.addEventListener('pointerup',()=>{drag=null;setTimeout(()=>{dragMoved=false},50)});

render();initSync();initAgent();
</script>
</body>
</html>
